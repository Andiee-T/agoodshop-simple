<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgoodShop</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>AgoodShop</h1>
  </header>

  <main class="contenedor">

    <!--Tabla de productos-->
    <section class="productos">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Pr. Unidad</th>
            <th>Total</th>
          </tr>
        </thead>

        <tbody id="lista-productos"></tbody>
      </table>
    </section>

    <!--Resumen del carrito-->
    <aside class="resumen">
      <h2>Total</h2>
      <ul id="resumen-productos"></ul>
      <p class="linea-total">
        <span>TOTAL</span>
        <span id="total">0.00 €</span>
      </p>
    </aside>

  </main>

  <script src="app.js"></script>
</body>
</html>
